spring.application.name=open-raffle
# Render (and most PaaS hosts) inject PORT.
server.port=${PORT:8080}

# Public base URL embedded in participant QR codes: scheme, host, and port if not the
# default, e.g. https://raffle.example.com or http://192.168.1.20:8081. Phones must be
# able to open it. Leave empty to derive it from each request (fine for local dev);
# set RAFFLE_PUBLIC_URL explicitly in production.
raffle.public-url=${RAFFLE_PUBLIC_URL:}
# BoardGameGeek API token (https://boardgamegeek.com/applications); empty hides the BGG field.
raffle.bgg.api-key=${BGG_API_KEY:}
# Cached BGG ratings are refreshed in the background (missing or a month old), pausing between calls.
raffle.bgg.refresh=true
raffle.bgg.refresh-every=PT6H
raffle.bgg.pause-ms=1500
# Google OAuth client (Web application) for connecting a Drive folder; both empty = feature off.
raffle.google.client-id=${GOOGLE_CLIENT_ID:}
raffle.google.client-secret=${GOOGLE_CLIENT_SECRET:}
# Organizer uploads: Vaadin streams them through the servlet, so the servlet limits apply too.
raffle.uploads.per-user-per-10-minutes=60
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=60MB
# Where prize images are kept. Must survive restarts and deploys (a mounted disk in production).
raffle.images-dir=${RAFFLE_IMAGES_DIR:./data/images}
# Trust X-Forwarded-Proto/Host/Port from the reverse proxy so request-derived URLs
# (and OIDC redirect URIs) use the public scheme and host.
server.forward-headers-strategy=framework

# --- Database ---
# Either a full JDBC URL in DB_URL, or the parts (what Render's managed Postgres provides).
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:raffle}}
spring.datasource.username=${DB_USER:raffle}
spring.datasource.password=${DB_PASSWORD:raffle}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Keycloak (OpenID Connect) ---
# The issuer must be the same URL from the browser and from the app process, so in
# dev the app runs on the host against the shared Keycloak in ../local-keycloak.
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:8180/realms/open-raffle}
spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID:open-raffle-app}
# Public client: authorization code flow with PKCE, no client secret. Spring adds the
# PKCE challenge automatically when the authentication method is "none".
spring.security.oauth2.client.registration.keycloak.client-authentication-method=none
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email

# --- Health check and version (unauthenticated; /actuator/info shows the build version) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# --- Vaadin ---
vaadin.launch-browser=false
vaadin.allowed-packages=com.vaadin,org.vaadin,org.openraffle

logging.level.org.atmosphere=warn
