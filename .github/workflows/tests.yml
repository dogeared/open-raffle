name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run test suite
        run: mvn --batch-mode test

      - name: Keep the coverage report for the badge job
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: target/site/jacoco/jacoco.csv
          if-no-files-found: error

  # After a green run on main, publish the coverage percentage to a gist that the README's
  # shields.io "endpoint" badge reads. Needs the GIST_SECRET repository secret: a fine-grained
  # PAT with only the "Gists: read and write" account permission.
  coverage-badge:
    name: Coverage badge
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: jacoco
          path: report

      - name: Compute instruction coverage
        id: coverage
        run: |
          python3 - <<'EOF'
          import csv, os
          missed = covered = 0
          for row in csv.DictReader(open("report/jacoco.csv")):
              missed += int(row["INSTRUCTION_MISSED"])
              covered += int(row["INSTRUCTION_COVERED"])
          pct = 100.0 * covered / (missed + covered)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"percent={pct:.1f}\n")
          print(f"instruction coverage: {pct:.1f}%")
          EOF

      - name: Update badge data in the gist
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 4eda955304a98d793584a2f69c52a7ba
          filename: open-raffle-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.percent }}%
          valColorRange: ${{ steps.coverage.outputs.percent }}
          minColorRange: 50
          maxColorRange: 95

  # After a green run on main, tag the commit with the pom version (v<version>) unless
  # that tag already exists or the version is a SNAPSHOT.
  tag:
    name: Tag release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Tag v<project version> if missing
        run: |
          # The first <version> in pom.xml is the Spring Boot parent's; ask Maven instead.
          VERSION=$(mvn --batch-mode --quiet help:evaluate -Dexpression=project.version -DforceStdout)
          TAG="v$VERSION"
          echo "Project version: $VERSION"
          case "$VERSION" in
            *-SNAPSHOT) echo "Snapshot version, not tagging."; exit 0 ;;
          esac
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Open Raffle $VERSION"
          git push origin "$TAG"
          echo "Pushed $TAG at $(git rev-parse --short HEAD)"

  # Publishes the NAS's copy of this app. The Synology pulls `:latest` on a timer;
  # `:sha-<short>` and the version tag are there for pinning a rollback.
  publish:
    name: Publish image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          root = ET.parse("pom.xml").getroot()
          version = root.findtext("m:version", namespaces=ns) or \
              root.findtext("m:parent/m:version", namespaces=ns)
          print(f"value={version}")
          EOF

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dogeared/open-raffle
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
            type=raw,value=${{ steps.version.outputs.value }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
